<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Dynamic Financial Flow Waves (F monogram) -->
  <g filter="url(#glow)">
    <!-- Top Flow Bar -->
    <path d="M 140 150 C 220 150, 300 130, 370 170 C 390 182, 380 210, 355 205 C 290 190, 230 205, 175 205 L 140 205 Z" fill="url(#flow)" />
    
    <!-- Middle Flow Bar -->
    <path d="M 140 240 C 200 240, 260 225, 310 250 C 328 260, 320 285, 298 280 C 250 270, 205 280, 165 280 L 140 280 Z" fill="url(#flow)" />
    
    <!-- Vertical Stem -->
    <rect x="140" y="150" width="36" height="230" rx="18" fill="url(#flow)" />

    <!-- AI Sparkle / Currency Coin -->
    <circle cx="360" cy="340" r="48" fill="#0F172A" stroke="url(#flow)" stroke-width="6" />
    <path d="M 360 315 L 366 333 L 385 340 L 366 347 L 360 365 L 354 347 L 335 340 L 354 333 Z" fill="#38BDF8" />
  </g>
</svg>
