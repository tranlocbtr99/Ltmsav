<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="targetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ringOut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ringMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ringIn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="targetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4c1d95" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="120" cy="100" r="82" fill="url(#targetBg)"/>

  <!-- Target Rings -->
  <g filter="url(#targetShadow)" transform="rotate(-10 120 100)">
    <!-- Outer Ring -->
    <ellipse cx="120" cy="100" rx="64" ry="54" fill="url(#ringOut)"/>
    <!-- Middle Ring -->
    <ellipse cx="120" cy="100" rx="46" ry="38" fill="#ffffff"/>
    <ellipse cx="120" cy="100" rx="38" ry="30" fill="url(#ringMid)"/>
    <!-- Inner Ring -->
    <ellipse cx="120" cy="100" rx="24" ry="18" fill="#ffffff"/>
    <ellipse cx="120" cy="100" rx="14" ry="10" fill="url(#ringIn)"/>

    <!-- 3D Arrow striking the bullseye -->
    <path d="M120 100 L165 45" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <polygon points="116,97 122,103 128,95" fill="#f59e0b"/>
    <!-- Arrow Fletching -->
    <path d="M162 48 L170 42 L164 40 L160 46" fill="#f43f5e"/>
    <path d="M166 52 L172 48 L174 44" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Coins & Sparkles -->
  <circle cx="62" cy="70" r="14" fill="#fbbf24" fill-opacity="0.9" filter="url(#targetShadow)"/>
  <text x="62" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>

  <circle cx="178" cy="135" r="12" fill="#38bdf8" fill-opacity="0.9"/>
  <text x="178" y="139" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>

  <path d="M68 135 L70 128 L72 135 L79 137 L72 139 L70 146 L68 139 L61 137 Z" fill="#fbbf24"/>
  <circle cx="180" cy="55" r="3.5" fill="#ec4899"/>
</svg>

