<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#059669" flood-opacity="0.22"/>
    </filter>
  </defs>

  <circle cx="120" cy="100" r="82" fill="url(#shieldBg)"/>
  <circle cx="55" cy="65" r="14" fill="#10b981" fill-opacity="0.12"/>
  <circle cx="185" cy="135" r="20" fill="#06b6d4" fill-opacity="0.12"/>

  <!-- Main Shield -->
  <g filter="url(#shieldShadow)">
    <path d="M120 32 C155 32 176 42 176 42 C176 96 154 136 120 158 C86 136 64 96 64 42 C64 42 85 32 120 32 Z" fill="url(#shieldGrad)"/>
    <!-- Specular highlight on shield -->
    <path d="M120 38 C148 38 166 46 166 46 C166 90 148 126 120 146 C120 38 120 38 120 38 Z" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Center Checkmark Badge -->
    <circle cx="120" cy="88" r="32" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M106 88 L116 98 L136 78" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Green Laurel / Sparkles -->
  <path d="M46 95 Q42 80 54 75 Q46 84 54 92 Z" fill="#10b981" opacity="0.7"/>
  <path d="M194 95 Q198 80 186 75 Q194 84 186 92 Z" fill="#10b981" opacity="0.7"/>
  
  <!-- Star Sparkles -->
  <path d="M80 44 L82 36 L84 44 L92 46 L84 48 L82 56 L80 48 L72 46 Z" fill="#fde047"/>
  <path d="M168 120 L169 114 L171 120 L177 121 L171 123 L169 129 L168 123 L162 121 Z" fill="#fde047"/>
  <circle cx="162" cy="46" r="4" fill="#38bdf8"/>
</svg>

