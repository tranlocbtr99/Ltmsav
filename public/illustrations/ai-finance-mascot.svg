<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mascotGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="botHead" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="botShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="120" cy="100" r="88" fill="url(#mascotGlow)"/>

  <!-- Antenna -->
  <line x1="120" y1="42" x2="120" y2="24" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="20" r="8" fill="#10b981" filter="url(#botShadow)"/>
  <circle cx="120" cy="20" r="4" fill="#ffffff"/>

  <!-- Head Base with Shadow -->
  <g filter="url(#botShadow)">
    <rect x="74" y="42" width="92" height="78" rx="30" fill="url(#botHead)"/>
    <!-- Specular highlight on top -->
    <rect x="84" y="45" width="72" height="12" rx="6" fill="#ffffff" fill-opacity="0.7"/>

    <!-- Ear Cups -->
    <rect x="64" y="62" width="12" height="38" rx="6" fill="url(#earGrad)"/>
    <rect x="164" y="62" width="12" height="38" rx="6" fill="url(#earGrad)"/>

    <!-- Visor -->
    <rect x="84" y="58" width="72" height="46" rx="20" fill="url(#visorGrad)"/>
    <!-- Cute Glowing Eyes (Cyan/Emerald) -->
    <ellipse cx="104" cy="78" rx="6.5" ry="9" fill="#38bdf8"/>
    <ellipse cx="136" cy="78" rx="6.5" ry="9" fill="#38bdf8"/>
    <!-- Eye Sparkles -->
    <circle cx="106" cy="74" r="2.5" fill="#ffffff"/>
    <circle cx="138" cy="74" r="2.5" fill="#ffffff"/>
    
    <!-- Blush -->
    <ellipse cx="94" cy="88" rx="4" ry="2" fill="#f43f5e" fill-opacity="0.4"/>
    <ellipse cx="146" cy="88" rx="4" ry="2" fill="#f43f5e" fill-opacity="0.4"/>
  </g>

  <!-- Floating Holographic Financial Badge -->
  <g transform="translate(142, 110)">
    <circle cx="20" cy="20" r="18" fill="#10b981" fill-opacity="0.9" filter="url(#botShadow)"/>
    <circle cx="20" cy="20" r="14" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
    <path d="M16 20 L20 16 L24 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 16 L20 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <path d="M54 75 L56 68 L58 75 L65 77 L58 79 L56 86 L54 79 L47 77 Z" fill="#fbbf24"/>
  <path d="M185 52 L186 46 L188 52 L194 53 L188 55 L186 61 L185 55 L179 53 Z" fill="#818cf8"/>
</svg>

