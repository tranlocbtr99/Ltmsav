<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="receiptGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="120" cy="100" r="85" fill="url(#bgGrad)"/>
  <circle cx="170" cy="50" r="18" fill="#10b981" fill-opacity="0.12"/>
  <circle cx="65" cy="140" r="24" fill="#6366f1" fill-opacity="0.1"/>

  <!-- Floating Credit Card (in background) -->
  <g transform="rotate(-14 150 75)" filter="url(#softShadow)">
    <rect x="110" y="45" width="85" height="52" rx="10" fill="url(#cardGrad)"/>
    <rect x="110" y="56" width="85" height="10" fill="#1e1b4b" fill-opacity="0.4"/>
    <rect x="120" y="76" width="22" height="12" rx="3" fill="#fbbf24"/>
    <circle cx="175" cy="82" r="6" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="182" cy="82" r="6" fill="#f43f5e" fill-opacity="0.7"/>
  </g>

  <!-- Main Floating Receipt -->
  <g filter="url(#softShadow)">
    <path d="M75 40 Q75 32 83 32 L147 32 Q155 32 155 40 L155 148 L147 142 L139 148 L131 142 L123 148 L115 142 L107 148 L99 142 L91 148 L83 142 L75 148 Z" fill="url(#receiptGrad)"/>
    <!-- Receipt Header Icon -->
    <circle cx="115" cy="54" r="10" fill="#10b981" fill-opacity="0.2"/>
    <path d="M112 54 L114 56 L118 52" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Receipt Lines -->
    <rect x="88" y="72" width="54" height="4" rx="2" fill="#94a3b8" fill-opacity="0.7"/>
    <rect x="88" y="82" width="38" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="88" y="91" width="46" height="3" rx="1.5" fill="#cbd5e1"/>
    <line x1="88" y1="104" x2="142" y2="104" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="88" y="114" width="26" height="4" rx="2" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="124" y="113" width="18" height="6" rx="2" fill="#10b981"/>
  </g>

  <!-- Golden 3D Coins in Foreground -->
  <g filter="url(#glowGold)" transform="translate(48, 110)">
    <circle cx="20" cy="20" r="18" fill="url(#coinGrad)"/>
    <circle cx="20" cy="20" r="14" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>
  </g>
  <g filter="url(#glowGold)" transform="translate(146, 120) scale(0.75)">
    <circle cx="20" cy="20" r="18" fill="url(#coinGrad)"/>
    <circle cx="20" cy="20" r="14" stroke="#fef3c7" stroke-width="1.5" fill="none"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>
  </g>

  <!-- Sparkles -->
  <path d="M68 50 L70 42 L72 50 L80 52 L72 54 L70 62 L68 54 L60 52 Z" fill="#fbbf24"/>
  <path d="M182 118 L183 113 L185 118 L190 119 L185 121 L183 126 L182 121 L177 119 Z" fill="#38bdf8"/>
  <circle cx="162" cy="36" r="3" fill="#a78bfa"/>
</svg>

