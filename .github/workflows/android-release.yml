name: Build Android APK and Google Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Do NOT use cache here — we generate package-lock.json first

      - name: Setup Java 17 (Compatible with Android Gradle Plugin 8.x)
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || \
            sdkmanager "platforms;android-35" "build-tools;34.0.0" || true

      - name: Install Web Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Prepare Mobile Packaging (Capacitor)
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          rm -rf dist
          cp -r ../dist ./dist
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          # Integrate Native Android Biometric (Fingerprint & Face Unlock)
          mkdir -p android/app/src/main/java/com/ltmsav/app
          cp custom_android/*.java android/app/src/main/java/com/ltmsav/app/

          # Add androidx.biometric dependency to app/build.gradle
          if ! grep -q "androidx.biometric:biometric" android/app/build.gradle; then
            sed -i '/dependencies {/a \    implementation "androidx.biometric:biometric:1.2.0-alpha05"' android/app/build.gradle
          fi

          # Add USE_BIOMETRIC permission to AndroidManifest.xml
          if ! grep -q "android.permission.USE_BIOMETRIC" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure Android SDK Level and Force Java 17 across ALL subprojects
        working-directory: mobile/android
        run: |
          if [ -f "variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' variables.gradle || true
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' variables.gradle || true
          fi

          # Fix Java version in ALL build.gradle files (app + capacitor-android + plugins)
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            sed -i 's/JavaVersion\.VERSION_21/JavaVersion.VERSION_17/g' "$f" || true
            sed -i "s/sourceCompatibility JavaVersion\.VERSION_21/sourceCompatibility JavaVersion.VERSION_17/g" "$f" || true
            sed -i "s/targetCompatibility JavaVersion\.VERSION_21/targetCompatibility JavaVersion.VERSION_17/g" "$f" || true
            sed -i "s/jvmTarget = '21'/jvmTarget = '17'/g" "$f" || true
            sed -i 's/jvmTarget = "21"/jvmTarget = "17"/g' "$f" || true
            sed -i "s/sourceCompatibility = '21'/sourceCompatibility = '17'/g" "$f" || true
            sed -i 's/sourceCompatibility = "21"/sourceCompatibility = "17"/g' "$f" || true
            sed -i "s/targetCompatibility = '21'/targetCompatibility = '17'/g" "$f" || true
            sed -i 's/targetCompatibility = "21"/targetCompatibility = "17"/g' "$f" || true
          done

          # Inject root gradle.properties to pin JAVA_HOME for ALL modules
          echo "" >> gradle.properties
          echo "# Force Java 17 for all subprojects" >> gradle.properties
          echo "org.gradle.java.home=$JAVA_HOME_17_X64" >> gradle.properties
          cat gradle.properties

      - name: Generate Release Signing Key
        working-directory: mobile/android
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias ltmsav \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ltmsav2026 \
            -keypass ltmsav2026 \
            -dname "CN=LTMsav App, OU=LTMsav, O=LTMsav, L=HoChiMinh, ST=HoChiMinh, C=VN" \
            -noprompt

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK and AAB
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: keystore/release.jks
          KEYSTORE_PASSWORD: ltmsav2026
          KEY_ALIAS: ltmsav
          KEY_PASSWORD: ltmsav2026
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon || true

      - name: Sign Release Artifacts
        working-directory: mobile/android
        run: |
          mkdir -p final_artifacts

          # 1. Sign Release AAB using jarsigner (Official Google standard)
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            echo "Signing $AAB_FILE with jarsigner..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore keystore/release.jks \
              -storepass ltmsav2026 \
              -keypass ltmsav2026 \
              "$AAB_FILE" ltmsav
            cp "$AAB_FILE" final_artifacts/FinFlow-GooglePlay-Signed.aab
          fi

          # 2. Align and sign Release APK
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)

          if [ -f "$APK_RAW" ]; then
            if [ -n "$ZIPALIGN" ] && [ -n "$APKSIGNER" ]; then
              echo "Aligning $APK_RAW with $ZIPALIGN..."
              "$ZIPALIGN" -v -p 4 "$APK_RAW" final_artifacts/aligned.apk || cp "$APK_RAW" final_artifacts/aligned.apk
              echo "Signing with $APKSIGNER..."
              "$APKSIGNER" sign \
                --ks keystore/release.jks \
                --ks-pass pass:ltmsav2026 \
                --key-pass pass:ltmsav2026 \
                --out final_artifacts/FinFlow-Release-Signed.apk \
                final_artifacts/aligned.apk || cp "$APK_RAW" final_artifacts/FinFlow-Release-Signed.apk
              rm -f final_artifacts/aligned.apk
            else
              cp "$APK_RAW" final_artifacts/FinFlow-Release-Signed.apk
            fi
          fi

      - name: Upload Debug APK (For Immediate Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Signed Release APK (For Direct Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Signed-Release-APK
          path: |
            mobile/android/final_artifacts/FinFlow-Release-Signed.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Google Play Release Bundle (AAB for CH Play)
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-GooglePlay-AAB
          path: |
            mobile/android/final_artifacts/FinFlow-GooglePlay-Signed.aab
            mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
