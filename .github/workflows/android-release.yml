name: Verify and release LTMsav
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltmsav-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm test && npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: python3 -m pip install Pillow==11.3.0
      - run: node scripts/prepare-mobile.mjs
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew lintRelease testReleaseUnitTest assembleRelease bundleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: verified-unsigned-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
  sign:
    needs: verify
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: verified-unsigned-${{ github.sha }}
          path: mobile/android/app/build/outputs
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Sign with existing LTMsav key only
        env:
          KEYSTORE_BASE64: ${{ secrets.LTMSAV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LTMSAV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LTMSAV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LTMSAV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          export KEYSTORE_PATH="$RUNNER_TEMP/ltmsav-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          bash scripts/sign-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LTMsav-signed-${{ github.sha }}
          path: |
            build-output/LTMsav_*.apk
            build-output/LTMsav_*.aab
            build-output/SHA256SUMS
            build-output/signature.txt
            build-output/package.txt
          if-no-files-found: error
          retention-days: 30
