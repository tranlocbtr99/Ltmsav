name: Build Android APK and Google Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21 (Required by Capacitor 7 / capacitor-android)
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          # Use the latest cmdline-tools already on the runner
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Web Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Prepare Mobile Packaging (Capacitor)
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          rm -rf dist
          cp -r ../dist ./dist
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

          # Integrate Native Android Biometric (Fingerprint & Face Unlock)
          mkdir -p android/app/src/main/java/com/ltmsav/app
          test -f custom_android/MainActivity.java
          test -f custom_android/NativeBiometricPlugin.java
          cp custom_android/*.java android/app/src/main/java/com/ltmsav/app/

          # Use the stable AndroidX biometric library rather than an alpha release.
          # Add androidx.biometric dependency to app/build.gradle
          if ! grep -q "androidx.biometric:biometric" android/app/build.gradle; then
            sed -i '/dependencies {/a \    implementation "androidx.biometric:biometric:1.1.0"' android/app/build.gradle
          fi

          # Verify application ID to avoid creating an incompatible replacement package.
          grep -q 'applicationId "com.ltmsav.app"' android/app/build.gradle || { echo "Unexpected Android application ID" >&2; exit 1; }

          # Add USE_BIOMETRIC permission to AndroidManifest.xml
          if ! grep -q "android.permission.USE_BIOMETRIC" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure Android SDK Level (compileSdk & targetSdk = 35)
        working-directory: mobile/android
        run: |
          # Fix variables.gradle if Capacitor generated it
          if [ -f "variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' variables.gradle || true
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' variables.gradle || true
          fi

          # Ensure Gradle uses the Java 21 JDK set up by actions/setup-java
          echo "" >> gradle.properties
          echo "# Pin Gradle daemon to Java 21 installed by CI" >> gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

          echo 'Gradle Java and memory settings configured'

      # Signing material must be persistent and stored in GitHub Actions Secrets.
      # Never generate a new release key on every build.
      - name: Apply Android release version
        working-directory: mobile
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {versionCode, versionName} = JSON.parse(fs.readFileSync('android-version.json','utf8'));
          if (!Number.isSafeInteger(versionCode) || versionCode < 1 || !/^\d+\.\d+\.\d+$/.test(versionName)) throw new Error('Invalid Android version');
          const file = 'android/app/build.gradle';
          let source = fs.readFileSync(file,'utf8');
          if (!/versionCode\s+\d+/.test(source) || !/versionName\s+"[^"]+"/.test(source)) throw new Error('Cannot update Android version');
          source = source.replace(/versionCode\s+\d+/, 'versionCode '+versionCode).replace(/versionName\s+"[^"]+"/, 'versionName "'+versionName+'"');
          fs.writeFileSync(file,source);
          JS

      - name: Require signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Release signing secrets are missing. No release will be published." >&2
            exit 1
          }

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          chmod 600 keystore/release.jks
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          keytool -list -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL_FINGERPRINT=$(keytool -exportcert -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          test "$ACTUAL_FINGERPRINT" = "fd714dfb07beaaca658d99bdcab1982c964eeb3c24e1f66c0ab084ae14731ac7" || { echo 'Unexpected signing certificate. Release blocked.' >&2; exit 1; }

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android

        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign Release Artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          mkdir -p final_artifacts

          # 1. Sign AAB with jarsigner
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore keystore/release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB_FILE" "$KEY_ALIAS"
            cp "$AAB_FILE" final_artifacts/LTMsav-GooglePlay-Signed.aab
            echo "AAB signed: final_artifacts/LTMsav-GooglePlay-Signed.aab"
          else
            echo "No AAB found" >&2
            exit 1
          fi

          # 2. Align and sign APK
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" 2>/dev/null | sort -V | tail -n 1)

          if [ -f "$APK_RAW" ]; then
            if [ -n "$ZIPALIGN" ] && [ -n "$APKSIGNER" ]; then
              "$ZIPALIGN" -v -p 4 "$APK_RAW" final_artifacts/aligned.apk
              "$APKSIGNER" sign \
                --ks keystore/release.jks \
                --ks-pass env:KEYSTORE_PASSWORD \
                --key-pass env:KEY_PASSWORD \
                --out final_artifacts/LTMsav-Release-Signed.apk \
                final_artifacts/aligned.apk
              rm -f final_artifacts/aligned.apk
              echo "APK signed: final_artifacts/LTMsav-Release-Signed.apk"
            else
              echo 'Signing tools unavailable' >&2
              exit 1
            fi
          else
            echo "No release APK found" >&2
            exit 1
          fi

      - name: Verify signed Android artifacts
        working-directory: mobile/android
        run: |
          set -euo pipefail
          APK="final_artifacts/LTMsav-Release-Signed.apk"
          AAB="final_artifacts/LTMsav-GooglePlay-Signed.aab"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -s "$APK" && test -s "$AAB" && test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED="fd714dfb07beaaca658d99bdcab1982c964eeb3c24e1f66c0ab084ae14731ac7"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signed APK certificate mismatch" >&2; exit 1; }
          jarsigner -verify -strict "$AAB" >/dev/null
          echo "APK and AAB signature verification passed"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LTMsav-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Signed Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: LTMsav-Signed-Release-APK
          if-no-files-found: error
          path: mobile/android/final_artifacts/LTMsav-Release-Signed.apk
          retention-days: 30

      - name: Upload Google Play AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: LTMsav-GooglePlay-AAB
          if-no-files-found: error
          path: mobile/android/final_artifacts/LTMsav-GooglePlay-Signed.aab
          retention-days: 30
