name: Validate and build LTMsav
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltmsav-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
  android:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select fixed-key signing or local signing
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ltmsav-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo 'Compiling unsigned artifacts for private local signing; no key will be generated in CI.'
          fi
      - run: npm ci
      - run: npm ci --prefix mobile
      - name: Generate Android project
        working-directory: mobile
        run: |
          mkdir -p dist
          cp ../index.html dist/index.html
          npx cap add android
          mkdir -p android/app/src/main/java/com/ltmsav/app
          cp custom_android/*.java android/app/src/main/java/com/ltmsav/app/
          sed -i '/dependencies {/a \    implementation "androidx.biometric:biometric:1.2.0-alpha05"' android/app/build.gradle
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/;s/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          sed -i 's/>ltmsav-android</>LTMsav</g' android/app/src/main/res/values/strings.xml
      - name: Set automatic version
        id: version
        run: node scripts/release-version.mjs
      - run: python3 -m pip install Pillow==11.3.0
      - run: npm run logo -- assets/logo-source.png
      - run: npm run build
      - name: Sync bundled web and icons
        run: |
          rm -rf mobile/dist
          cp -r dist mobile/dist
          cd mobile
          npx cap sync android
      - name: Install required Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build unsigned release
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Sign and verify
        if: steps.key.outputs.available == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release
          "$TOOLS/zipalign" -p 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk release/aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/ltmsav-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out release/LTMsav-${{ steps.version.outputs.version }}.apk release/aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs release/LTMsav-*.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab release/LTMsav-${{ steps.version.outputs.version }}.aab
          jarsigner -keystore "$RUNNER_TEMP/ltmsav-release.jks" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD release/LTMsav-*.aab "$KEY_ALIAS"
          jarsigner -verify release/LTMsav-*.aab
          "$TOOLS/aapt" dump badging release/LTMsav-*.apk | head -1
          rm release/aligned.apk
      - name: Prepare unsigned local-signing kit
        if: steps.key.outputs.available != 'true'
        run: |
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release
          "$TOOLS/zipalign" -P 16 -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk release/LTMsav-unsigned.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab release/LTMsav-unsigned.aab
          cp "$TOOLS/lib/apksigner.jar" release/apksigner.jar
          cp src/release.json release/version.json
          git rev-parse HEAD > release/source-commit.txt
          sha256sum release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LTMsav-${{ steps.version.outputs.version }}-${{ steps.key.outputs.available == 'true' && 'signed' || 'unsigned' }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ltmsav-release.jks"
